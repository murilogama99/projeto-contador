<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="css/contato.css">
</head>
<body>
     <header class="navbar">
        <div class="logo">
            <a href="index.html">
                <img src="img/logobge.png" alt="BGE"> 
            </a>
        </div>
        <nav class="nav-links">
            <a href="ingresso.html">Bilheteria</a>
            <a href="info.html">Informações</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main class="contact-section">
        <div class="contact-container">
            
            <img src="img/logobge.png" alt="BGE Logo" class="bge-logo">
            <h1 class="titulo">Contato</h1>

            <div class="info">
                <p>E-mail de Suporte: suporte@brasilgameexpo.com.br</p>
                <p>Horário de Atendimento: Segunda - Sábado, das 08h até 20h</p>
            </div>

            <div class="form-card">
                <h2 class="titulo-form">Formulário</h2>
                
                <form id="contato-form">
                    <div class="input-group">
                        <input type="email" placeholder="Insira seu E-mail..." required>
                    </div>
                    
                    <div class="input-group">
                        <input type="text" placeholder="Insira seu Nome..." required>
                    </div>
                    
                    <div class="input-group">
                        <textarea placeholder="Mensagem..." rows="5" required></textarea>
                    </div>
                    
                    <button type="submit" class="env-botao">Enviar</button>
                </form>
            </div>

        </div>
    </main>
</body>
</html>
